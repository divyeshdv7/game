<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Arcade - 30 Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* [EXISTING CSS (OMITTED FOR BREVITY) - Keep your existing styles] */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        #app { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 40px; padding: 20px; }
        header h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 20px; }
        .search-box { max-width: 500px; margin: 0 auto; }
        .search-box input { width: 100%; padding: 15px 20px; border: none; border-radius: 50px; font-size: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); outline: none; transition: transform 0.3s; }
        .search-box input:focus { transform: scale(1.05); }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .game-card { background: white; border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .game-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .game-icon { font-size: 4rem; margin-bottom: 15px; }
        .game-card h3 { font-size: 1.4rem; color: #333; margin-bottom: 10px; }
        .game-card p { color: #666; margin-bottom: 20px; font-size: 0.95rem; }
        .play-btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        footer { text-align: center; color: white; padding: 20px; font-size: 1.1rem; }
        @media (max-width: 768px) { header h1 { font-size: 2rem; } .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; } .game-card { padding: 20px; } .game-icon { font-size: 3rem; } }

        /* --- NEW FILTER STYLES --- */
        .filter-controls { 
            text-align: center; 
            margin-top: 30px; 
            margin-bottom: 40px;
        }
        .filter-controls button {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            transition: background-color 0.3s, transform 0.1s;
        }
        .filter-controls button:hover, .filter-controls button.active {
            background-color: white;
            color: #764ba2;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* [EXISTING AUTH STYLES (OMITTED FOR BREVITY) - Keep your existing styles] */
        .auth-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .container { background-color: #fff; border-radius: 30px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; width: 768px; max-width: 90%; min-height: 480px; }
        .container p { font-size: 14px; line-height: 20px; letter-spacing: 0.3px; margin: 20px 0; }
        .container span { font-size: 12px; }
        .container button { background-color: #512da8; color: #fff; font-size: 12px; padding: 10px 45px; border: 1px solid transparent; border-radius: 8px; font-weight: 600; text-transform: uppercase; margin-top: 10px; cursor: pointer; }
        .container button.hidden { background-color: transparent; border-color: #fff; }
        .container form { background-color: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 40px; height: 100%; }
        .container input { background-color: #eee; border: none; margin: 8px 0; padding: 10px 15px; font-size: 13px; border-radius: 8px; width: 100%; outline: none; }
        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
        .sign-in { left: 0; width: 50%; z-index: 2; }
        .container.active .sign-in { transform: translateX(100%); }
        .sign-up { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.active .sign-up { transform: translateX(100%); opacity: 1; z-index: 5; }
        .toggle-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: all 0.6s ease-in-out; border-radius: 150px 0 0 100px; z-index: 1000; }
        .container.active .toggle-container { transform: translateX(-100%); border-radius: 0 150px 100px 0; }
        .toggle { background: linear-gradient(to right, #5c6bc0, #512da8); color: #fff; position: relative; left: -100%; height: 100%; width: 200%; transform: translateX(0); transition: all 0.6s ease-in-out; }
        .container.active .toggle { transform: translateX(50%); }
        .toggle-panel { position: absolute; width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 30px; text-align: center; top: 0; transition: all 0.6s ease-in-out; }
        .toggle-left { transform: translateX(-200%); }
        .container.active .toggle-left { transform: translateX(0); }
        .toggle-right { right: 0; transform: translateX(0); }
        .container.active .toggle-right { transform: translateX(200%); }
    </style>
</head>
<body onload="checkLoginState()">

    <div class="auth-overlay" id="authOverlay">
        <div class="container" id="authContainer">
            
            <div class="form-container sign-up">
                <form id="registerForm">
                    <h1>Create Account</h1>
                    <p>Join the Arcade!</p>
                    <input type="text" id="regName" placeholder="Name" required>
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <input type="password" id="regPass" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                    <div id="regMessage" style="color:red; margin-top: 10px;"></div>
                </form>
            </div>

            <div class="form-container sign-in">
                <form id="loginForm">
                    <h1>Sign In</h1>
                    <p>Access 30 Games</p>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPass" placeholder="Password" required>
                    <button type="submit">Sign In</button>
                    <div id="loginMessage" style="color:red; margin-top: 10px;"></div>
                </form>
            </div>

            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                        <h1>Welcome Back!</h1>
                        <p>Sign in to play your favorite games.</p>
                        <button class="hidden" id="loginToggle">Sign In</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>New Player?</h1>
                        <p>Register now and start your adventure!</p>
                        <button class="hidden" id="registerToggle">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="app" style="display: none;">
        <header>
            <h1>🎮 Game Arcade</h1>
            <p id="welcomeUser">Welcome, Guest! Choose from 30 awesome games to play!</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search games..." onkeyup="searchGames(this.value)">
            </div>
            
            <div class="filter-controls" id="filterButtons">
                </div>
            
            <button onclick="logout()" style="position: absolute; top: 30px; right: 30px; padding: 10px 20px; background-color: #c93434;">Logout</button>
        </header>
        <div class="games-grid" id="gamesGrid">
            </div>
        <footer>
            <p>🎮 30 Games Collection | Made with ❤️ by Divyesh</p>
        </footer>
    </div>
    
    <script>
        // --- AUTHENTICATION STATE & MOCK DATABASE ---
        const USER_KEY = 'arcade_users';
        const STATE_KEY = 'arcade_logged_in';
        
        const getStoredUsers = () => JSON.parse(localStorage.getItem(USER_KEY)) || [];
        const setStoredUsers = (users) => localStorage.setItem(USER_KEY, JSON.stringify(users));

        // --- GAME LIST (UPDATED WITH CATEGORY) ---
        const gameList = [
            { id: 1, name: "Candy Crush", icon: "🍬", description: "Match colorful candies!", path: "01-Candy-Crush-Game/index.html", category: "Puzzle" },
            { id: 2, name: "Archery Game", icon: "🏹", description: "Hit the target!", path: "02-Archery-Game/index.html", category: "Action" },
            { id: 3, name: "Speed Typing", icon: "⌨️", description: "Test your typing speed", path: "03-Speed-Typing-Game/index.html", category: "Typing" },
            { id: 4, name: "Breakout", icon: "🧱", description: "Break all the bricks", path: "04-Breakout-Game/index.html", category: "Arcade" },
            { id: 5, name: "Minesweeper", icon: "💣", description: "Find all the mines", path: "05-Minesweeper-Game/index.html", category: "Puzzle" },
            { id: 6, name: "Tower Blocks", icon: "🏗️", description: "Stack blocks high!", path: "06-Tower-Blocks/index.html", category: "Puzzle" },
            { id: 7, name: "Ping Pong", icon: "🏓", description: "Classic paddle game", path: "07-Ping-Pong-Game/index.html", category: "Arcade" },
            { id: 8, name: "Tetris", icon: "🎮", description: "Stack the blocks", path: "08-Tetris-Game/index.html", category: "Puzzle" },
            { id: 9, name: "Tilting Maze", icon: "🌀", description: "Navigate the maze", path: "09-Tilting-Maze-Game/index.html", category: "Logic" },
            { id: 10, name: "Memory Card", icon: "🎴", description: "Match the pairs", path: "10-Memory-Card-Game/index.html", category: "Puzzle" },
            { id: 11, name: "Rock Paper Scissors", icon: "✊", description: "Challenge the computer", path: "11-Rock-Paper-Scissors/index.html", category: "Logic" },
            { id: 12, name: "Number Guessing", icon: "🔢", description: "Guess the number", path: "12-Type-Number-Guessing-Game/index.html", category: "Logic" },
            { id: 13, name: "Tic Tac Toe", icon: "❌", description: "Beat your opponent", path: "13-Tic-Tac-Toe/index.html", category: "Logic" },
            { id: 14, name: "Snake Game", icon: "🐍", description: "Classic snake adventure", path: "14-Snake-Game/index.html", category: "Arcade" },
            { id: 15, name: "Connect Four", icon: "🔴", description: "Line up four pieces", path: "15-Connect-Four-Game/index.html", category: "Logic" },
            { id: 16, name: "Insect Catch", icon: "🦋", description: "Catch the insects!", path: "16-Insect-Catch-Game/index.html", category: "Action" },
            { id: 17, name: "Typing Game", icon: "⌨️", description: "Type fast and accurate", path: "17-Typing-Game/index.html", category: "Typing" },
            { id: 18, name: "Hangman", icon: "🔤", description: "Guess the word", path: "18-Hangman-Game/index.html", category: "Puzzle" },
            { id: 19, name: "Flappy Bird", icon: "🐦", description: "Tap to fly!", path: "19-Flappy-Bird-Game/index.html", category: "Arcade" },
            { id: 20, name: "Crossy Road", icon: "🐔", description: "Cross the road safely", path: "20-Crossy-Road-Game/index.html", category: "Arcade" },
            { id: 21, name: "2048 Game", icon: "🔢", description: "Merge to 2048!", path: "21-2048-Game/index.html", category: "Puzzle" },
            { id: 22, name: "Dice Roll Simulator", icon: "🎲", description: "Roll the dice", path: "22-Dice-Roll-Simulator/index.html", category: "Logic" },
            { id: 23, name: "Shape Clicker", icon: "🔷", description: "Click the shapes!", path: "23-Shape-Clicker-Game/index.html", category: "Action" },
            { id: 24, name: "Typing Game 2", icon: "⌨️", description: "Another typing challenge", path: "24-Typing-Game/index.html", category: "Typing" },
            { id: 25, name: "Speak Number Guessing", icon: "🎤", description: "Voice-based game", path: "25-Speak-Number-Guessing-Game/index.html", category: "Logic" },
            { id: 26, name: "Fruit Slicer", icon: "🍎", description: "Slice the fruits!", path: "26-Fruit-Slicer-Game/index.html", category: "Action" },
            { id: 27, name: "Quiz Game", icon: "❓", description: "Test your knowledge", path: "27-Quiz-Game/index.html", category: "Logic" },
            { id: 28, name: "Emoji Catcher", icon: "😊", description: "Catch the emojis!", path: "28-Emoji-Catcher-Game/index.html", category: "Action" },
            { id: 29, name: "Whack A Mole", icon: "🔨", description: "Hit the moles!", path: "29-Whack-A-Mole-Game/index.html", category: "Action" },
            { id: 30, name: "Simon Says", icon: "🎵", description: "Memory pattern game", path: "30-Simon-Says-Game/index.html", category: "Puzzle" },
        ];
        
        // Extract all unique categories
        const categories = [...new Set(gameList.map(game => game.category))];

        // --- GAME ARCADE RENDERING FUNCTIONS ---
        const gamesGrid = document.getElementById('gamesGrid');

        function createGameCardHTML(game) {
            // Using Template Literals for cleaner HTML generation
            return `
                <div class="game-card" data-name="${game.name}" data-category="${game.category}">
                    <div class="game-icon">${game.icon}</div>
                    <h3>${game.name}</h3>
                    <p>${game.description}</p>
                    <a href="${game.path}" class="play-btn">Play Now</a>
                </div>
            `;
        }

        // Consolidated function for loading and filtering
        function loadGames(filterCategory = 'All') {
            gamesGrid.innerHTML = '';
            
            const filteredList = (filterCategory === 'All') 
                ? gameList 
                : gameList.filter(game => game.category === filterCategory);

            filteredList.forEach(game => { gamesGrid.innerHTML += createGameCardHTML(game); });
            
            // Re-apply click listeners
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.className !== 'play-btn') {
                        this.querySelector('.play-btn').click();
                    }
                });
            });
            
            // Highlight the active filter button
            document.querySelectorAll('#filterButtons button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === filterCategory || (filterCategory === 'All' && btn.innerText === 'All')) {
                    btn.classList.add('active');
                }
            });
        }
        
        // NEW FUNCTION: Renders filter buttons
        function renderFilterButtons() {
            const container = document.getElementById('filterButtons');
            // Add 'All' button first
            let html = `<button class="active" onclick="loadGames('All')">All</button>`;
            
            categories.forEach(category => {
                html += `<button onclick="loadGames('${category}')">${category}</button>`;
            });
            container.innerHTML = html;
        }

        // Updated Search Function (Now uses the category filter system)
        function searchGames(searchTerm) {
            const filter = searchTerm.toUpperCase();
            
            const filteredList = gameList.filter(game => 
                game.name.toUpperCase().includes(filter) || 
                game.description.toUpperCase().includes(filter)
            );

            gamesGrid.innerHTML = '';
            filteredList.forEach(game => { gamesGrid.innerHTML += createGameCardHTML(game); });
            
            // Disable active filter button when searching
            document.querySelectorAll('#filterButtons button').forEach(btn => btn.classList.remove('active'));
        }
        
        // --- AUTHENTICATION FUNCTIONS (Existing) ---
        const authContainer = document.getElementById('authContainer');
        const authOverlay = document.getElementById('authOverlay');
        const appContent = document.getElementById('app');
        
        function checkLoginState() {
            const user = localStorage.getItem(STATE_KEY);
            if (user) {
                // User is logged in
                renderFilterButtons(); // RENDER FILTERS ON LOGIN
                loadGames('All');
                appContent.style.display = 'block';
                authOverlay.style.display = 'none';
                document.getElementById('welcomeUser').innerText = `Welcome, ${user}! Choose from 30 awesome games to play!`;
            } else {
                // User is not logged in
                appContent.style.display = 'none';
                authOverlay.style.display = 'flex';
            }
        }

        function logout() {
            localStorage.removeItem(STATE_KEY);
            alert("You have been logged out.");
            checkLoginState();
        }
        
        document.getElementById('registerToggle').addEventListener('click', () => { authContainer.classList.add("active"); });
        document.getElementById('loginToggle').addEventListener('click', () => { authContainer.classList.remove("active"); });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const messageDiv = document.getElementById('regMessage');

            let users = getStoredUsers();
            if (users.some(u => u.email === email)) {
                messageDiv.innerText = 'Error: Account already exists.';
                return;
            }

            users.push({ name, email, password });
            setStoredUsers(users);
            messageDiv.style.color = 'green';
            messageDiv.innerText = 'Registration successful! Please Sign In.';
            authContainer.classList.remove("active"); 
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const messageDiv = document.getElementById('loginMessage');
            
            const users = getStoredUsers();
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem(STATE_KEY, user.name);
                messageDiv.style.color = 'green';
                messageDiv.innerText = 'Success! Loading arcade...';
                
                setTimeout(() => { checkLoginState(); }, 500);

            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'Invalid email or password.';
            }
        });
    </script>
</body>
</html>
